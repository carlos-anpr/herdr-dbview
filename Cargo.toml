[package]
name = "herdr-dbview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Consola de base de datos para herdr: pregunta en lenguaje natural, SQL editable y resultados reales, con cambio rápido de conexión"

[dependencies]
anyhow = "1"
postgres = "0.19"
ratatui = "0.30"
ratatui-textarea = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
